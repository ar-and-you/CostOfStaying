name: Documentation Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-governance:
    name: document-governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce documentation scope for stabilization PRs
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/stabilization'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z "origin/${BASE_REF}...HEAD" > /tmp/changed-paths
          mapfile -d '' -t changed < /tmp/changed-paths
          ((${#changed[@]} > 0)) || { echo "No changed paths detected"; exit 1; }
          for path in "${changed[@]}"; do
            case "$path" in
              src/*|tests/*|*.cs|*.py)
                echo "Documentation stabilization PR must not alter source/tests: $path"
                exit 1
                ;;
              AGENTS.md|CONTRIBUTING.md|ROADMAP.md|README.md|\
              docs/*.md|docs/*/*.md|docs/*/*/*.md|\
              docs/*.txt|docs/*/*.txt|docs/*/*/*.txt|\
              docs/*.json|docs/*/*.json|docs/*/*/*.json|\
              docs/*.yml|docs/*/*.yml|docs/*/*/*.yml|\
              docs/*.yaml|docs/*/*.yaml|docs/*/*/*.yaml|\
              docs/*.csv|docs/*/*.csv|docs/*/*/*.csv|\
              .github/workflows/docs-governance.yml|tools/docs_audit.sh|.agents/skills/*/SKILL.md)
                ;;
              *) echo "Path is outside the documentation-only allow-list: $path"; exit 1 ;;
            esac
          done

      - name: Audit Markdown links and documentation index reachability
        run: bash tools/docs_audit.sh
