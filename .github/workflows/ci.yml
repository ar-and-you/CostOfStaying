name: Domain and Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-python:
    name: Domain (.NET 8) and simulator regressions (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from root global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Set up uv for zizmor
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          checksum: "bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c"
          require-checksums: true
          enable-cache: false

      - name: Audit GitHub Actions security
        run: uvx "zizmor@1.33.1" --offline --strict-collection --format=github .github/workflows

      - name: Verify Python syntax
        run: python3 -m compileall -q tools/balance_simulator tools/playtest

      - name: Run GitHub workflow hygiene tests
        run: python3 -m unittest discover -s tools/github_workflow_tests -v

      - name: Run Domain NUnit tests
        run: dotnet test tests/CostOfStaying.Domain.Tests/CostOfStaying.Domain.Tests.csproj --configuration Release

      - name: Run Python simulator regression tests
        run: python3 tools/balance_simulator/test_parity.py

      - name: Run simulated-playtest CLI regression tests
        run: python3 tools/playtest/test_cli.py

      - name: Run bounded simulated-playtest smoke test
        run: python3 tools/playtest/test_smoke.py -v
