name: Core CI (.NET 10)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Build and test standalone Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from Core test global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: tests/CostOfStaying.Core.Tests/global.json

      - name: Run Core NUnit tests
        working-directory: tests/CostOfStaying.Core.Tests
        run: dotnet test CostOfStaying.Core.Tests.csproj --configuration Release
